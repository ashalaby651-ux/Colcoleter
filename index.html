<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الآلة الحاسبة الذكية - مكتب القزاز للبرمجيات</title>
    <!-- استيراد مكتبات التصميم والأيقونات -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            margin: 0;
        }
        .calculator-container {
            width: 100%;
            max-width: 380px;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid #334155;
        }
        .calculator-header {
            background: #0f172a;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        .calculator-header h5 {
            margin: 0;
            font-size: 1rem;
            color: #38bdf8;
            font-weight: bold;
        }
        .display-screen {
            background: #090d16;
            padding: 20px;
            text-align: left;
            direction: ltr;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            word-break: break-all;
            word-wrap: break-word;
        }
        .previous-operand {
            color: #64748b;
            font-size: 1.1rem;
            min-height: 24px;
        }
        .current-operand {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: bold;
        }
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 15px;
        }
        .calc-btn {
            background-color: #334155;
            border: none;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 600;
            padding: 15px 0;
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .calc-btn:hover {
            background-color: #475569;
            transform: translateY(-2px);
        }
        .btn-operator {
            background-color: #f59e0b;
            color: #fff;
        }
        .btn-operator:hover {
            background-color: #d97706;
        }
        .btn-action {
            background-color: #ef4444;
            color: #fff;
        }
        .btn-action:hover {
            background-color: #dc2626;
        }
        .btn-equals {
            background-color: #2563eb;
            color: #fff;
            grid-column: span 2;
        }
        .btn-equals:hover {
            background-color: #1d4ed8;
        }
        .footer-brand {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <!-- هيدر الآلة -->
        <div class="calculator-header">
            <h5><i class="fa-solid fa-calculator me-1"></i> الآلة الحاسبة الذكية</h5>
        </div>

        <!-- شاشة العرض -->
        <div class="display-screen">
            <div id="previousOperand" class="previous-operand"></div>
            <div id="currentOperand" class="current-operand">0</div>
        </div>

        <!-- أزرار الإمكانيات والعمليات -->
        <div class="buttons-grid">
            <button class="calc-btn btn-action" onclick="clearAll()">C</button>
            <button class="calc-btn" onclick="deleteDigit()"><i class="fa-solid fa-delete-left"></i></button>
            <button class="calc-btn btn-operator" onclick="appendOperator('%')">%</button>
            <button class="calc-btn btn-operator" onclick="appendOperator('/')">÷</button>

            <button class="calc-btn" onclick="appendNumber('7')">7</button>
            <button class="calc-btn" onclick="appendNumber('8')">8</button>
            <button class="calc-btn" onclick="appendNumber('9')">9</button>
            <button class="calc-btn btn-operator" onclick="appendOperator('*')">×</button>

            <button class="calc-btn" onclick="appendNumber('4')">4</button>
            <button class="calc-btn" onclick="appendNumber('5')">5</button>
            <button class="calc-btn" onclick="appendNumber('6')">6</button>
            <button class="calc-btn btn-operator" onclick="appendOperator('-')">-</button>

            <button class="calc-btn" onclick="appendNumber('1')">1</button>
            <button class="calc-btn" onclick="appendNumber('2')">2</button>
            <button class="calc-btn" onclick="appendNumber('3')">3</button>
            <button class="calc-btn btn-operator" onclick="appendOperator('+')">+</button>

            <button class="calc-btn" onclick="appendNumber('0')">0</button>
            <button class="calc-btn" onclick="appendNumber('.')">.</button>
            <button class="calc-btn btn-equals" onclick="compute()">=</button>
        </div>
    </div>

    <div class="footer-brand">
        تصميم وتطوير: <b>مكتب القزاز للبرمجيات</b>
    </div>

    <!-- كود التشغيل والمنطق البرمجي للآلة -->
    <script>
        let currentOperandText = document.getElementById('currentOperand');
        let previousOperandText = document.getElementById('previousOperand');
        let currentInput = '0';
        let previousInput = '';
        let operation = null;

        function updateDisplay() {
            currentOperandText.innerText = currentInput;
            if (operation != null) {
                previousInputText = `${previousInput} ${operation}`;
                previousOperandText.innerText = previousInputText;
            } else {
                previousOperandText.innerText = '';
            }
        }

        function appendNumber(number) {
            if (number === '.' && currentInput.includes('.')) return;
            if (currentInput === '0' && number !== '.') {
                currentInput = number;
            } else {
                currentInput += number;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentInput === '' && previousInput === '') return;
            if (previousInput !== '') {
                compute();
            }
            operation = op;
            previousInput = currentInput;
            currentInput = '';
            updateDisplay();
        }

        function compute() {
            let computation;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '*':
                    computation = prev * current;
                    break;
                case '/':
                    computation = current === 0 ? 'خطأ (قسمة ع صفر)' : prev / current;
                    break;
                case '%':
                    computation = (prev * current) / 100;
                    break;
                default:
                    return;
            }

            currentInput = computation.toString();
            operation = null;
            previousInput = '';
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            previousInput = '';
            operation = null;
            updateDisplay();
        }

        function deleteDigit() {
            if (currentInput.length === 1) {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }
    </script>
</body>
</html>
